# ลิงก์ทดสอบสาธารณะบน GitHub Pages: https://chickenggeasy-cmd.github.io/taxeasy/
# เป็นเวอร์ชันไม่มีหลังบ้าน (build --mode preview): คำนวณ ลดหย่อน วางแผน และเทียบกับแบบที่ยื่นแล้วได้ครบ
# ส่วน AI สแกน 50 ทวิ และแจ้งปัญหาถูกซ่อน ตัวเลขที่ผู้ทดสอบกรอกอยู่ในเครื่องของเขาเท่านั้น
name: Deploy test site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Test tax engine
        run: npm test

      - name: Build test version (no backend)
        run: npx vite build --mode preview

      - name: Add images, icons and manifest
        run: |
          mkdir -p dist-preview/images dist-preview/icons
          cp public/images/*.webp dist-preview/images/
          cp public/icons/* dist-preview/icons/
          cp public/manifest.webmanifest dist-preview/
          touch dist-preview/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
