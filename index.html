<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>ภาษีง่ายๆ</title>
    <meta name="description" content="คำนวณภาษีเงินได้บุคคลธรรมดา พร้อมสิทธิลดหย่อนตามกฎล่าสุด" />
    <meta name="theme-color" content="#2340c9" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script type="module" crossorigin src="./assets/index-DY3ErCLT.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BE9HhlWO.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // กันหน้าขาว: ถ้าแอปไม่ขึ้นภายใน 6 วินาที (มักเกิดจากไฟล์เก่าที่ service worker เก็บไว้)
      // ให้ล้างแคชและ service worker แล้วโหลดใหม่เองหนึ่งครั้ง
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && root.childElementCount > 0) return
        try {
          if (sessionStorage.getItem('taxeasy:recovered')) return
          sessionStorage.setItem('taxeasy:recovered', '1')
        } catch (e) {
          return
        }
        var jobs = []
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister() }))
          }))
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k) }))
          }))
        }
        Promise.all(jobs).finally(function () { location.reload() })
      }, 6000)
    </script>
  </body>
</html>
